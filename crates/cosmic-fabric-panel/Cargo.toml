[package]
name = "cosmic-fabric-panel"
version = "0.1.0"
edition = "2021"
description = "COSMIC panel applet for cosmic-fabric — fabric deployment status + quick-run"
license = "MIT"

[[bin]]
name = "cosmic-fabric-panel"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
# Pinned to the same libcosmic rev as cosmic-display-control (cached on-box, known-good API).
libcosmic = { git = "https://github.com/pop-os/libcosmic", rev = "8fa6a01d049905ce99eb9adf8415b2fa73611818", default-features = false, features = [
    "applet",
    "applet-token",
    "multi-window",
    "tokio",
    "wayland",
    "winit",
] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
